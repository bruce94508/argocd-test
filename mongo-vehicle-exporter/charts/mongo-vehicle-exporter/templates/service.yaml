apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-svc
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- with $.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ $.Values.service.type | default "ClusterIP" }}
  ports:
    - name: http-metrics
      port: {{ $.Values.service.port }}
      targetPort: http
  selector:
    {{- with $.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
